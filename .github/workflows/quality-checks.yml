name: Quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate static site
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          set -eu
          node --check app.js
          node --check features.js
      - name: Prevent privileged Supabase keys in browser code
        run: |
          set -eu
          if grep -Eiq 'service_role|sb_secret_[A-Za-z0-9_-]+' app.js features.js; then
            echo 'Privileged Supabase key pattern found in browser code.' >&2
            exit 1
          fi
      - name: Check required site and policy files
        run: |
          set -eu
          test -s index.html
          test -s style.css
          test -s app.js
          test -s README.md
          test -s SECURITY.md
          test -s CONTRIBUTING.md
          test -s robots.txt
          test -s sitemap.xml
          test -s favicon.svg
      - name: Check local asset references
        run: |
          set -eu
          grep -Eq 'href="[^"]*style\.css' index.html
          grep -Eq 'src="[^"]*app\.js' index.html
          grep -Eq 'href="[^"]*favicon\.svg' index.html
